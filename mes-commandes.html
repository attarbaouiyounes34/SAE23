<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes commandes — Coffee Break</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <span class="logo-text">Coffee <span class="logo-accent">Break</span></span>
                <span class="logo-sub">R&T Béziers</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Menu</a></li>
                <li><a href="mes-commandes.html" class="active">Mes commandes</a></li>
                <li><a href="fidelite.html">Fidélité</a></li>
            </ul>
            <div class="nav-right">
                <button id="themeToggle" class="theme-toggle" onclick="toggleTheme()">🌙</button>
                <a href="login.html" class="btn-login">Se connecter</a>
            </div>
        </div>
    </nav>

    <main class="page-content">
        <div class="page-header">
            <h1>Mes commandes</h1>
            <p>Suivez l'état de vos commandes en temps réel</p>
        </div>
        <div id="commandesContainer">
            <p>Chargement des commandes...</p>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-brand"><span>Coffee Break — R&T Béziers</span></div>
            <p class="footer-copy">SAE23 — Application WEB &copy; 2025-2026<br>Younes ATTARBAOUI &amp; Maxime MAURA</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            fetch('api-commandes.php')
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    var container = document.getElementById('commandesContainer');
                    if (data.erreur) {
                        container.innerHTML = '<p>Connectez-vous pour voir vos commandes. <a href="login.html">Se connecter</a></p>';
                        return;
                    }
                    if (data.commandes.length === 0) {
                        container.innerHTML = '<p>Aucune commande pour le moment. <a href="index.html">Voir le menu</a></p>';
                        return;
                    }
                    container.innerHTML = data.commandes.map(function (cmd) {
                        var statusClass = 'status-pending';
                        var statusText = 'En attente';
                        if (cmd.statut === 'validee') { statusClass = 'status-validated'; statusText = 'Validée'; }
                        if (cmd.statut === 'servie') { statusClass = 'status-served'; statusText = 'Servie ✓'; }
                        if (cmd.statut === 'annulee') { statusClass = 'status-pending'; statusText = 'Annulée'; }

                        var date = new Date(cmd.date_commande);
                        var dateStr = date.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }) + ' — ' + date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });

                        var itemsHtml = cmd.items.map(function (item) {
                            return '<div class="order-item">' +
                                '<div><strong>' + item.nom + '</strong></div>' +
                                '<span class="order-item-qty">x' + item.quantite + '</span>' +
                                '<span class="order-item-price">' + (parseFloat(item.prix_unitaire) * item.quantite).toFixed(2) + '€</span>' +
                                '</div>';
                        }).join('');

                        var footerExtra = '';
                        if (cmd.statut === 'en_attente') footerExtra = '<button class="btn-cancel" onclick="annulerCommande(' + cmd.id + ')">Annuler</button>';
                        if (cmd.statut === 'validee') footerExtra = '<span class="order-info">Préparation en cours...</span>';
                        if (cmd.statut === 'servie') footerExtra = '<span class="order-info">+1 point fidélité gagné !</span>';

                        return '<div class="order-card">' +
                            '<div class="order-header"><div><span class="order-id">#CMD-' + String(cmd.id).padStart(3, '0') + '</span><span class="order-date">' + dateStr + '</span></div><span class="order-status ' + statusClass + '">' + statusText + '</span></div>' +
                            '<div class="order-body">' + itemsHtml + '</div>' +
                            '<div class="order-footer"><span class="order-total">Total : ' + cmd.total.toFixed(2) + '€</span>' + footerExtra + '</div>' +
                            '</div>';
                    }).join('');
                })
                .catch(function () {
                    document.getElementById('commandesContainer').innerHTML = '<p>Erreur de chargement. <a href="login.html">Se connecter</a></p>';
                });
        });

        function annulerCommande(id) {
            if (!confirm('Annuler cette commande ?')) return;
            fetch('traitement-annuler.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ order_id: id })
            })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (data.succes) location.reload();
                    else alert(data.erreur || 'Erreur');
                });
        }
    </script>
</body>

</html>
