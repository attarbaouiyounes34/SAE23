<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription — Coffee Break</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body class="page-login">

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <span class="logo-text">Coffee <span class="logo-accent">Break</span></span>
                <span class="logo-sub">R&T Béziers</span>
            </a>
            <div class="nav-right">
                <button id="themeToggle" class="theme-toggle" onclick="toggleTheme()">🌙</button>
            </div>
        </div>
    </nav>

    <main class="login-wrapper">
        <div class="login-visual">
            <div class="login-visual-content">
                <h2>Rejoignez<br><em>Coffee Break</em></h2>
                <p>Créez votre compte et profitez<br>du programme fidélité.</p>
                <div class="login-features">
                    <div class="login-feature"><span>&#127873;</span> 10 points = 1 boisson offerte</div>
                    <div class="login-feature"><span>&#128230;</span> Historique de commandes</div>
                    <div class="login-feature"><span>&#9889;</span> Commande en 1 clic</div>
                </div>
            </div>
        </div>
        <div class="login-form-side">
            <div class="login-card">
                <h1>Créer un compte</h1>
                <p class="login-subtitle">Remplissez le formulaire pour vous inscrire.</p>
                <div id="registerError" class="alert alert-error" style="display:none;"></div>
                <div id="registerSuccess" class="alert alert-success" style="display:none;"></div>
                <form method="POST" action="traitement-register.php">
                    <div class="form-group">
                        <label for="reg-user">Nom d'utilisateur</label>
                        <input type="text" id="reg-user" name="reg-user" placeholder="ex: alice" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-mail">Adresse email</label>
                        <input type="email" id="reg-mail" name="reg-mail" placeholder="ex: alice@etudiant.fr" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-pass">Mot de passe</label>
                        <div class="input-password">
                            <input type="password" id="reg-pass" name="reg-pass" placeholder="Minimum 6 caractères"
                                required>
                            <button type="button" class="toggle-pass"
                                onclick="togglePassword('reg-pass')">&#128065;</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="reg-pass2">Confirmation du mot de passe</label>
                        <div class="input-password">
                            <input type="password" id="reg-pass2" name="reg-pass2" placeholder="Retapez le mot de passe"
                                required>
                            <button type="button" class="toggle-pass"
                                onclick="togglePassword('reg-pass2')">&#128065;</button>
                        </div>
                    </div>
                    <div class="form-group captcha-group">
                        <label for="captcha">Vérification anti-robot</label>
                        <div class="captcha-row">
                            <span class="captcha-question" id="captchaQuestion"></span>
                            <input type="text" id="captcha" name="captcha" placeholder="?" class="captcha-input"
                                required>
                            <button type="button" class="captcha-refresh" onclick="generateCaptcha()"
                                title="Nouveau calcul">&#8635;</button>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary btn-full">Créer mon compte</button>
                </form>
                <p class="login-footer-text">Déjà un compte ? <a href="login.html">Se connecter</a></p>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        var captchaAnswer = 0;
        function generateCaptcha() {
            var a = Math.floor(Math.random() * 10) + 1;
            var b = Math.floor(Math.random() * 10) + 1;
            captchaAnswer = a + b;
            document.getElementById('captchaQuestion').textContent = a + ' + ' + b + ' = ';
            document.getElementById('captcha').value = '';
        }
        generateCaptcha();

        function togglePassword(id) {
            var input = document.getElementById(id);
            input.type = input.type === 'password' ? 'text' : 'password';
        }
    </script>
</body>

</html>
